[project]
name = "ojs"
version = "0.8.2a0"
description = "Tools for working with the Open Journal Systems (OJS) API."
authors = [
    {name = "gitronald", email = "gitronald@users.noreply.github.com"}
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "polars>=1.41.2",
    "python-dotenv>=1.2.2",
    "typer>=0.26.7",
]
readme = "README.md"
license = "MIT"

[project.urls]
repository = "https://github.com/gitronald/ojs"

[project.scripts]
ojs = "ojs.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit",
    "pyrefly>=1.0.0",
    "pytest>=9.0.2",
    "pytest-cov",
    "ruff>=0.15",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python idioms)
]

[tool.pyrefly]
preset = "strict"
python-version = "3.11"
project-includes = ["."]
project-excludes = ["**/__pycache__", "**/.venv"]

# tests/ stays type-checked (imports, undefined names, type mismatches),
# but the implicit-any check is relaxed there so unannotated pytest fixture
# params (e.g. `def test_x(tmp_path):`) don't force annotations.
[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
