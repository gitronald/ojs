[project]
name = "ojs"
version = "0.8.3"
description = "Tools for working with the Open Journal Systems (OJS) API."
authors = [
    {name = "gitronald", email = "gitronald@users.noreply.github.com"}
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "polars>=1.41.2",
    "python-dotenv>=1.2.2",
    "typer>=0.26.7",
]
readme = "README.md"
license = "MIT"

[project.urls]
repository = "https://github.com/gitronald/ojs"

[project.scripts]
ojs = "ojs.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Ship only what a PyPI consumer needs. Root-anchored (leading "/") so bare
# filenames don't glob at every depth — this keeps internal plan files
# (.planners/), the .claude/ holder, tests, and tooling out of the published
# sdist.
only-include = [
    "/ojs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pyrefly>=1.0.0",
    "pytest>=9.0.2",
    "pytest-cov",
    "ruff>=0.15",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python idioms)
]

[tool.pyrefly]
preset = "strict"
python-version = "3.11"
project-includes = ["."]
project-excludes = ["**/__pycache__", "**/.venv"]

# tests/ stays type-checked (imports, undefined names, type mismatches),
# but the implicit-any check is relaxed there so unannotated pytest fixture
# params (e.g. `def test_x(tmp_path):`) don't force annotations.
[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["ojs"]
branch = true

[tool.coverage.report]
skip_empty = true
fail_under = 86
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
